name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: [ "3.13", "3.14" ]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true

    - name: Install Dependencies
      run: make install ARGS="--locked"

    - name: Run Code Checks
      run: make check

    - name: Running Tests
      run: make test

  build:
    name: Build Package
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      UV_PYTHON: "3.14"

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
        fetch-depth: 0  # we need all tags for hatch-vcs versioning

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true

    - name: Build Package
      run: make build ARGS="--locked"

    # upload before the smoke test so code executed by the install cannot alter the published artifact
    - name: Upload Package
      if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
      uses: actions/upload-artifact@v7
      with:
        name: python-package-distributions
        path: dist/

    - name: Check Package Metadata
      run: uvx twine check --strict dist/*

    - name: Install and smoke-test the built wheel
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        set -o pipefail
        uv venv /tmp/wheel-test
        VIRTUAL_ENV=/tmp/wheel-test uv sync --locked --no-dev --no-install-project --active
        uv pip install --no-build --no-deps --python /tmp/wheel-test/bin/python dist/*.whl
        PP=/tmp/wheel-test/bin/pp-terminal
        $PP --version
        if [ -n "$RELEASE_TAG" ]; then
          $PP --version | grep -qxF "pp-terminal version: ${RELEASE_TAG#v}"
        fi
        # both XStream reference flavors, to exercise the packaged ppxml2db end-to-end
        for xml in tests/fixtures/kommer.ids.xml tests/fixtures/kommer.xml; do
          $PP --file "$xml" --output json --no-cache view accounts | jq -e 'length > 0' > /dev/null
        done

  publish-to-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    environment: test-pypi

    permissions:
      id-token: write

    steps:
      - name: Download Package
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  publish-to-pypi:
    name: Publish to PyPI
    needs: publish-to-testpypi
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    environment: pypi

    permissions:
      id-token: write

    steps:
      - name: Download Package
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          attestations: true