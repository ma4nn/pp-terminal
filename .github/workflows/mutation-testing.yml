name: Mutation Testing

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  mutation-test:
    name: Mutation Test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.14"

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        enable-cache: true

    - name: Install Dependencies
      run: make install ARGS="--locked"

    - name: Run Mutation Tests
      run: make test-mutations
