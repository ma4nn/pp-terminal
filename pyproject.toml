[project]
name = "pp-terminal"
description = "The Analytic Companion for Portfolio Performance"
authors = [{ name = "Christoph Massmann", email = "chris@dev-investor.de" }]
readme = "README.md"
requires-python = ">=3.13,<4.0.0"
license = "GPL-3.0-or-later"
dependencies = [
    "typer (>=0.15.1,<0.28.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "rich (>=14.3.4,<16.0.0)",
    "pandera (>=0.29.0,<0.33.0)",
    "babel (>=2.16.0,<3.0.0)",
    "lxml (>=6.1.1,<7.0.0)",
    "typer-config (>=1.4.0,<2.0.0)",
    "pydantic (>=2.12.0,<3.0.0)",
    "faker (>=40.31.0,<41.0.0)",
    "openpyxl (>=3.1.0,<4.0.0)",
    "mcp (>=1.28.1,<2.0.0)",
]
scripts = { pp-terminal = "pp_terminal.main:app" }
entry-points = { "pp_terminal.commands" = { "view.accounts" = "pp_terminal.commands.view_accounts:app", "view.cash-flows" = "pp_terminal.commands.view_cash_flows:app", "view.securities" = "pp_terminal.commands.view_securities:app", "view.taxonomies" = "pp_terminal.commands.view_taxonomies:app", "simulate.vorabpauschale" = "pp_terminal.commands.simulate_vap:app", "simulate.interest" = "pp_terminal.commands.simulate_interest:app", "simulate.share-sell" = "pp_terminal.commands.simulate_share_sell:app", "simulate.pmt" = "pp_terminal.commands.simulate_pmt:app", "validate" = "pp_terminal.commands.validate:app", "export" = "pp_terminal.commands.export:app", "init" = "pp_terminal.commands.init:app" } }
dynamic = ["version"]


[build-system]
requires = ["hatchling>=1.27,<2", "hatch-vcs>=0.4,<1"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { local_scheme = "no-local-version" }

[tool.hatch.build.targets.wheel]
# hatchling >=1.32 defaults to metadata 2.5, which twine in gh-action-pypi-publish rejects (packaging <26.1)
core-metadata-version = "2.4"
include = ["/pp_terminal", "/ppxml2db"]
exclude = ["ppxml2db/.git", "ppxml2db/Makefile", "ppxml2db/README.md", "**/__pycache__"]
dev-mode-dirs = ["."]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["/pp_terminal", "/ppxml2db"]
exclude = ["ppxml2db/.git", "ppxml2db/__pycache__"]

[dependency-groups]
dev = [
    "pylint>=4.0.4,<5.0.0",
    "pytest>=9.0.3,<10.0.0",
    "mypy>=1.14.1,<3.0.0",
    "bandit>=1.8.2,<2.0.0",
    "mutmut>=3.4.0,<4.0.0",
    "coverage>=7.13.1,<8.0.0",
]

[tool.mutmut]
paths_to_mutate = ["pp_terminal/"]
pytest_add_cli_args_test_selection = ["tests/"]
also_copy = ["ppxml2db/"]

[tool.coverage.run]
source = ["pp_terminal/"]
omit = ["tests/*", "*/__init__.py"]
